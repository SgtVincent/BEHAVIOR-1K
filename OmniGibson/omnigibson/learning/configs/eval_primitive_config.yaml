# Single-primitive Evaluation Configuration for BEHAVIOR-1K
# This config is intended for OmniGibson/omnigibson/learning/eval_primitive.py

defaults:
  - base_config.yaml
  - _self_

# Primitive evaluation settings
# Dataset root containing `annotations/` and `data/`
demo_data_path: ???

# Optional raw HDF5 folder for full-state restoration
rawdata_path: null

# Optional per-demo primitive world-state cache directory
# Defaults to <demo_data_path>/meta/primitive_states if null
primitive_state_cache_dir: null

# Which demo to use. If null, script will pick the first available demo for the task.
demo_id: null

# Primitive index after sorting primitives by start frame (0-based)
primitive_idx: ???

# Optional override for max steps to run within the primitive
primitive_max_steps: null

# (Optional) Primitive-eval guidance for hierarchical / VLM policies
# - expected_skill: soft hint included in the VLM prompt
expected_skill: null

# Override default settings for eval_primitive
# We want to load training instances to match demo instances by default
# (demo_id encodes the instance id)
eval_on_train_instances: true
write_video: true

# Primitive-level success criterion (task-agnostic default)
#
# Background:
# - OmniGibson `terminated=True` means the FULL task is complete.
# - For mid-trajectory primitives (e.g., "pick up from"), that makes success_rate ~0.
#
# This evaluator optionally defines primitive success by matching the current low-dim
# robot state to the demo's end-frame state for this primitive.
primitive_success_use_state_match: true

# Thresholds for the state-match criterion.
# You may need to tune these per task / primitive family.
primitive_success_base_pos_threshold: 0.15
primitive_success_yaw_threshold: 0.35
primitive_success_eef_pos_threshold: 0.12
primitive_success_gripper_qpos_threshold: 0.03
primitive_success_std_joint_qpos_rmse_threshold: 0.25
primitive_success_joint_qpos_rmse_threshold: 0.25